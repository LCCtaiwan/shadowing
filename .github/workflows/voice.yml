name: 配音（Gemini TTS）

on:
  schedule:
    - cron: "0 19 * * *"   # 每天台灣時間 03:00：配今天與明天要用的內容
  push:
    branches: [main, mini/japanese-mvp]
    paths: ["scripts/**", "story/**", "curriculum/**"]
  workflow_dispatch:
    inputs:
      paths:
        description: "要配音的檔案或資料夾（空白 = 今天與明天）"
        required: false

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: 驗證劇本
        run: python tools/validate.py
      - name: 產生索引
        run: python tools/build_index.py
      - name: 配音
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
        run: |
          if [ -n "${{ github.event.inputs.paths }}" ]; then
            python tools/voice.py ${{ github.event.inputs.paths }}
          else
            python tools/voice.py --for-date today
            python tools/voice.py --for-date tomorrow
          fi
      - name: Commit 音檔與索引
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add audio scripts/index.json
          git diff --cached --quiet || git commit -m "audio: 自動配音 $(date -u +%F)"
          git push
